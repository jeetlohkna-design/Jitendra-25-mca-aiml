
<!DOCTYPE html>
<html>
<head>
    <title>Random Joke Website</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding: 50px 15px;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #3333;
        }

        h1 { color: #6c5ce7; }

        #joke {
            font-size: 20px;
            margin: 25px 0;
            color: #333;
        }

        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #4834d4; }
    </style>
</head>
<body>

<div class="box">
    <h1>😂 Random Jokes</h1>
    <p id="joke">Click the button to get a joke!</p>
    <button onclick="getJoke()">Get New Joke</button>
</div>

<script>
async function getJoke() {
    const joke = document.getElementById("joke");
    joke.innerHTML = "Loading joke...";

    try {
        const response = await fetch(
            "https://v2.jokeapi.dev/joke/Any?safe-mode"
        );

        const data = await response.json();

        if (data.type === "single") {
            joke.innerHTML = data.joke;
        } else {
            joke.innerHTML = data.setup + "<br><br>" + data.delivery;
        }
    } catch (error) {
        joke.innerHTML = "Unable to load joke. Try again!";
    }
}
</script>

</body>
</html>
